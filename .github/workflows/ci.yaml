name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -c "import yaml; c=yaml.safe_load(open('config/racks.yaml')); assert all(len(r['locations']) == r['rows'] * r['columns'] for r in c['racks'])"
